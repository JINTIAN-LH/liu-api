# demo profile — 使用 H2 内存数据库，无需外部 MySQL/Redis
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:yuapi;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  session:
    store-type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.session.data.redis.RedisSessionRepositoryAutoConfiguration

dubbo:
  enabled: false

server:
  port: ${PORT:7529}
